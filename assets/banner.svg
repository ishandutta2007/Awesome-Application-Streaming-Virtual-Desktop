<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatPacket {
      0% { stroke-dashoffset: 240; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 4px; opacity: 0.4; }
      50% { r: 7px; opacity: 1; }
    }
    .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .stream-line { stroke-dasharray: 40 200; animation: floatPacket 4s linear infinite; }
    .node-1 { animation: nodePulse 3s ease-in-out infinite; }
    .node-2 { animation: nodePulse 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="12"/>
  <rect width="1200" height="350" fill="url(#grid)" rx="12"/>

  <!-- Dynamic Background Glow Elements -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="1000" cy="250" r="220" fill="#818cf8" filter="url(#glow)" class="bg-pulse"/>

  <!-- Animated Stream Lines in Background -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="2">
    <path d="M 50 280 C 300 200, 500 320, 800 240 C 950 200, 1100 260, 1150 220" class="stream-line"/>
    <path d="M 100 80 C 350 160, 650 40, 900 120 C 1050 160, 1120 100, 1180 140" class="stream-line" style="animation-duration: 6s;"/>
  </g>

  <!-- Network Nodes -->
  <g fill="#38bdf8">
    <circle cx="300" cy="200" class="node-1"/>
    <circle cx="800" cy="240" class="node-2"/>
    <circle cx="650" cy="40" class="node-1"/>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(60, 0)">
    <!-- Header Icon Pill -->
    <rect x="0" y="55" width="230" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="15" y="77" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      🖥️ VDI &amp; APP STREAMING
    </text>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Application Streaming
    </text>
    <text x="0" y="195" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      &amp; Virtual Desktop Ecosystem 🌐
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated directory of enterprise DaaS, HTML5 app publishing &amp; self-hosted open-source VDI solutions.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 268)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">☁️ Cloud DaaS</text>

      <rect x="142" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="156" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🌐 Clientless HTML5</text>

      <rect x="319" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="333" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔓 Open-Source VDI</text>

      <rect x="491" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="505" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🎮 WebRTC Streaming</text>
    </g>
  </g>
</svg>
